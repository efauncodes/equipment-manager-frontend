events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      add_header Allow "GET, HEAD" always;
      if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
      }
      return 200 "ok\n";
    }

    location = / {
      add_header Allow "GET, HEAD" always;
      if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
      }
      try_files /index.html =404;
    }

    location ~ ^/staging(?:/|$) {
      return 404;
    }

    location ~ ^/api(?:/|$) {
      return 404;
    }

    location ~ (^|/)\. {
      return 404;
    }

    location / {
      add_header Allow "GET, HEAD" always;
      if (!-f $request_filename) {
        return 404;
      }
      if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
      }
      try_files $uri =404;
    }
  }
}
