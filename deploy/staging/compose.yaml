services:
  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE must reference an immutable image digest}"
    ports:
      - "127.0.0.1:18083:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
